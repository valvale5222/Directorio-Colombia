<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Directorio – Gerencia Comercial</title>
<script>
(function(){
  var saved = localStorage.getItem('dc-theme');
  var theme = (saved === 'light' || saved === 'dark') ? saved
    : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,-25..0&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/views/portada.css">
<link rel="stylesheet" href="assets/css/views/resumen.css">
<link rel="stylesheet" href="assets/css/views/ventas.css">
<link rel="stylesheet" href="assets/css/views/moventas.css">
<link rel="stylesheet" href="assets/css/views/pipeline.css">
<link rel="stylesheet" href="assets/css/views/clientes.css">
<link rel="stylesheet" href="assets/css/views/participacion.css">
<link rel="stylesheet" href="assets/css/views/objetivos.css">
<link rel="stylesheet" href="assets/css/views/proyectos.css">
<link rel="stylesheet" href="assets/css/views/organigrama.css">
</head>
<body>
<div class="app">

<header>
  <div class="hdr-top">
    <img class="hdr-logo" id="hdrLogo" alt="FrioPacking Colombia" src="assets/img/logo-friopacking-colombia.png">
    <div class="hdr-titles">
      <span class="t1">Directorio - Informe Ejecutivo</span>
      <span class="t2">Desempeño actual, pipeline de oportunidades y objetivos estratégicos</span>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Cambiar a modo oscuro">
      <span class="material-symbols-rounded" aria-hidden="true">dark_mode</span>
    </button>
    <svg class="hdr-flag" viewBox="0 0 3 2" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bandera de Colombia">
      <rect width="3" height="2" fill="#FCD116"/>
      <rect width="3" height="1" y="1" fill="#003893"/>
      <rect width="3" height="0.5" y="1.5" fill="#CE1126"/>
    </svg>
  </div>
  <div class="tabs" id="tabs">
    <div class="tab active" data-s="portada">🏠 Portada</div>
    <div class="tab" data-s="resumen">📋 Resumen</div>
    <div class="tab" data-s="ventas">💰 Ventas</div>
    <div class="tab" data-s="pipeline">🎯 Pipeline</div>
    <div class="tab" data-s="objetivos">🏆 Objetivos</div>
    <div class="tab" data-s="proyectos">🏗️ Proyectos en Curso</div>
    <div class="tab" data-s="clientes">👥 Clientes</div>
    <div class="tab" data-s="organigrama">🏢 Organigrama</div>
  </div>
</header>

<section class="section active" id="portada"></section>
<section class="section" id="resumen"></section>
<section class="section" id="ventas"></section>
<section class="section" id="pipeline"></section>
<section class="section" id="moventas"></section>
<section class="section" id="clientes"></section>
<section class="section" id="participacion"></section>
<section class="section" id="objetivos"></section>
<section class="section" id="proyectos"></section>
<section class="section" id="organigrama"></section>

<div class="org-modal-overlay" id="orgModalOverlay" onclick="if(event.target===this)closeOrgModal()">
  <div class="org-modal-box" id="orgModalContent"></div>
</div>
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-h">
      <div class="modal-h-info">
        <span class="mt" id="modalTitle"></span>
        <span class="msub" id="modalSubtitle"></span>
      </div>
      <span class="mc" onclick="closeModal()">&times;</span>
    </div>
    <div class="modal-b" id="modalBody"></div>
  </div>
</div>

<svg style="display:none">
  <symbol id="i-arr" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 0-2 2h-3"/></symbol>
  <symbol id="i-click" viewBox="0 0 24 24"><path d="M9 9l5 12 1.8-5.2L21 14 9 9z"/><path d="M7.2 2.2 8 5.1M5.1 8 2.2 7.2M14 4.1 12 6M6 12l-1.9 2"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18M18 17V9M13 17V5M8 17v-3"/></symbol>
  <symbol id="i-percent" viewBox="0 0 24 24"><path d="M19 5 5 19"/><circle cx="7" cy="7" r="2.4"/><circle cx="17" cy="17" r="2.4"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4m0 1h13l-3.2 4L18 13H5"/></symbol>
  <symbol id="i-crown" viewBox="0 0 24 24"><path d="M4 18h16M4 18 3 8l5 4 4-6 4 6 5-4-1 10"/></symbol>
  <symbol id="i-trend" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></symbol>
  <symbol id="i-pa-sync" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></symbol>
  <symbol id="i-pa-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></symbol>
  <symbol id="i-pa-book" viewBox="0 0 24 24"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5v-13Z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H13v16h5.5c.8 0 1.5-.7 1.5-1.5v-13Z"/></symbol>
</svg>

<script type="module" src="assets/js/main.js"></script>
</body>
</html>
